[build-system]
# INVESTIGATION: pin cython<3.2.8 to test the Windows dist failure
requires = ["scikit-build-core", "cython>=3.0,<3.2.8", "cython-cmake"]
build-backend = "scikit_build_core.build"

[project]
name = "hello"
version = "1.2.3"
authors = [
  { name = "The scikit-build team" },
]
description = "a minimal example package (cython version)"
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[tool.scikit-build]
cmake.source-dir = "."
minimum-version = "0.5"
